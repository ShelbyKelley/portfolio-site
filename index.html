<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Applied before first paint so the correct theme renders without a flash. -->
    <script>
      try {
        if (localStorage.getItem('theme') === 'dark') {
          document.documentElement.classList.add('dark')
        }
      } catch (e) {
        /* localStorage blocked; fall back to the light theme. */
      }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300;0,6..72,400;0,6..72,500;0,6..72,600;0,6..72,700;1,6..72,300&family=IBM+Plex+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Shelby's Portfolio</title>
    <meta
      name="description"
      content="Shelby Kelley — Technical Product/Program Manager with 8 years in software development, 5 leading engineering teams."
    />

    <!-- Open Graph (LinkedIn, Slack, Facebook, etc.) -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Shelby Kelley — Portfolio" />
    <meta
      property="og:description"
      content="Technical Product/Program Manager with 8 years in software development, including 5 years leading engineering teams."
    />
    <meta property="og:url" content="https://shelbyannkelley.com" />

    <!-- Twitter/X card -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Shelby Kelley — Portfolio" />
    <meta
      name="twitter:description"
      content="Technical Product/Program Manager with 8 years in software development, including 5 years leading engineering teams."
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
