name: Deploy

on:
  workflow_run:
    workflows: ['CI']
    branches: [main]
    types: [completed]

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: >-
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.conclusion == 'success'

    steps:
      - name: Check out code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          VITE_PACKAGE_HEALTH_API_URL: ${{ vars.VITE_PACKAGE_HEALTH_API_URL }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.DEPLOY_ROLE_ARN }}
          aws-region: us-east-1

      # Hashed asset filenames are safe to cache forever. Everything else
      # (index.html, favicon, resume.pdf) must revalidate so a deploy is
      # picked up even before the CloudFront invalidation lands.
      - name: Upload immutable assets to S3
        run: |
          aws s3 sync dist/ s3://shelby-portfolio --delete \
            --exclude "*" --include "assets/*" \
            --cache-control "public,max-age=31536000,immutable"

      - name: Upload remaining files to S3
        run: |
          aws s3 sync dist/ s3://shelby-portfolio --delete \
            --exclude "assets/*" \
            --cache-control "public,max-age=0,must-revalidate"

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/*"
